name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run still in flight. This repo is
  # private, so Actions minutes come out of a monthly quota - do not spend them
  # finishing a run whose result is already out of date.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip "ruff>=0.16.0,<0.17"
      - name: Lint
        # The project holds a zero-error standard; there is no warning tier.
        run: python -m ruff check potatopt chart_engine.py tests benchmarks scripts examples

  core-install:
    name: core install is really four packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with NO extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify the install stayed small and lazy
        # The LowSpecML claim as an executable check rather than a README
        # sentence. No test inside tests/ can do this - by then the extras exist.
        run: python scripts/verify_core_install.py

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every version in this list is also a classifier in pyproject.toml, and
        # every classifier is in this list. A support claim nobody runs is just a
        # guess. Windows is covered once because that is where this project is
        # developed; Windows runners bill at twice the rate of Linux ones.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with the automl, xai and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[automl,xai,viz,app,mcp,dev]"
      - name: Run the suite
        run: python -m pytest tests -q --durations=10
      - name: Report the versions that actually resolved
        if: always()
        run: python -c "import json, potatopt; print(json.dumps(potatopt.get_library_versions(), indent=2))"

  build:
    name: build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the package metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
